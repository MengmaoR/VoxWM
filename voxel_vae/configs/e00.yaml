experiment: E00 Voxel VAE sanity overfit
model:
  embedding_dim: 32
  base_channels: 96
  hidden_channels: 192
  latent_channels: 16
  logvar_clamp: [-10.0, 10.0]
training:
  seed: 42
  device: auto
  precision: fp32
  learning_rate: 0.0001
  weight_decay: 0.0001
  beta: 0.000001
  effective_batch_size: 64
  micro_batch_size: 2
  evaluation_batch_size: 2
  log_every: 25
loss:
  objective: static_dynamic_masked_v1
  lambda_static: 0.5
  lambda_dynamic: 0.5
  alpha_changed: 0.5
  beta_kl: 0.000001
e00_a:
  max_steps: 3000
  validate_every: 250
e00_b:
  max_steps: 5000
  validate_every: 500
